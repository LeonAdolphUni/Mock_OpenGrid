<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%">
  <defs>
    <!-- Gitter-Hintergrundmuster -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    </pattern>

    <!-- Dunkler Hintergrundverlauf -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151b23"/>
      <stop offset="100%" stop-color="#090d12"/>
    </radialGradient>

    <!-- Weicher Schatten unter der Strecke -->
    <filter id="trackShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <!-- Rote Curb-Streifenmuster -->
    <pattern id="curbPattern" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#e11d48"/>
      <rect x="14" width="14" height="28" fill="#ffffff"/>
    </pattern>

    <!-- Neuer weicher Verlauf für den nahtlosen Übergang am Schnittpunkt -->
    <linearGradient id="blendGrad" x1="0" y1="297" x2="0" y2="303" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Maske statt clipPath verwenden -->
    <mask id="overlapMask">
      <!-- x="400" und width="200" schließt die linke Seite des O aus! -->
      <!-- fill="url(#blendGrad)" sorgt für das weiche Ausblenden ab y=297 -->
      <rect x="400" y="0" width="200" height="400" fill="url(#blendGrad)" />
    </mask>
  </defs>

  <!-- Hintergrund -->
  <!-- <rect width="1000" height="850" fill="white"/> -->
  <!-- <rect width="1000" height="850" fill="url(#grid)" opacity="0.6"/> -->
  
  <g filter="url(#trackShadow)">

    <!-- O -->
    <g id="shapeO">
      <circle r="200" cx="300" cy="300"
            fill="none" stroke="#ffffff" stroke-width="90" />

      <circle r="200" cx="300" cy="300"
            fill="none" stroke="#000000" stroke-width="60" />

      <circle r="200" cx="300" cy="300"
            fill="none" stroke="#e11d48" stroke-width="5" />
    </g>

    <!-- G -->

      <g id="shapeG">
      <!-- Weißer, durchgehender Hintergrund -->
      <path d="M 841 158 
              A 200 200 0 0 0 500 300 
              A 200 200 0 0 0 900 300"  
            fill="none" stroke="#ffffff" stroke-width="90" />

      <!-- Schwarzer, durchgehender Innenpfad -->
      <path d="M 828 147 
              A 200 200 0 0 0 500 300 
              A 200 200 0 0 0 900 300"  
            fill="none" stroke="#000000" stroke-width="60" />

      <!-- Rote, durchgehende Linie -->
      <path d="M 828 147 
              A 200 200 0 0 0 500 300 
              A 200 200 0 0 0 900 300"  
            fill="none" stroke="#e11d48" stroke-width="5" />

      <polygon points="940,335 745,335 745,265 945,265 945,300" style="fill:#ffffff" />
      <polygon points="930,325 755,325 755,275 935,275" style="fill:#000000" />
      <line x1="765" y1="300" x2="900" y2="300" style="stroke:#e11d48;stroke-width:5" />
      <polygon points="927.2,336 866.1,336 866.3,305 932,305 929.95,325" style="fill:#000000" />
      <line x1="898" y1="297.5" x2="896.7" y2="336.1" style="stroke:#e11d48;stroke-width:5" />
    </g>

    <use href="#shapeO" mask="url(#overlapMask)" />

  </g>

  <!-- OpenGrid TYPOGRAFIE -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="140" letter-spacing="-1">
    <text x="180" y="745" fill="#ffffff"  filter="url(#trackShadow)">Open</text>
    <text x="540" y="745" fill="#e11d48"  filter="url(#trackShadow)">Grid</text>
  </g>
</svg>
