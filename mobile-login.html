<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGrid – Anmelden (Mobile)</title>

  <!-- Schrift + Icons (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">

  <link rel="stylesheet" href="styles.css?v=31ad82c9">
  <script src="app.js?v=7fc3de1a" defer></script>
</head>
<body class="device-page">

  <!-- Geräterahmen 390 × 844 (nur Mockup) -->
  <div class="device">
    <div class="device__safe-top" aria-hidden="true"></div>

    <!-- =================================================================
         Login → Scaffold(body: SingleChildScrollView(child: Column([...])))
         Gleicher Aufbau wie Desktop, nur ohne Kartenrahmen.
         ================================================================= -->
    <div class="screen">
      <div class="screen__body">
        <main class="login-card login-card--plain" aria-labelledby="login-title">

          <!-- Großes Logo (Bildmarke + Schriftzug) -->
          <div class="logo-full">
            <img src="icon_transparent.svg" alt="OpenGrid">
          </div>

          <div class="login-card__header">
            <h1 class="headline-small" id="login-title">Anmelden</h1>
            <p class="body-medium text-secondary">Melde dich mit deinem OpenGrid-Konto an</p>
          </div>

          <!-- Felder ohne name-Attribut: nichts landet in der URL -->
          <form class="login-form" action="mobile-home.html" method="get" novalidate>
            <div class="text-field">
              <input class="text-field__input" id="email" type="email" autocomplete="email" placeholder=" ">
              <label class="text-field__label" for="email">E-Mail</label>
            </div>

            <div class="text-field text-field--trailing">
              <input class="text-field__input" id="password" type="password" autocomplete="current-password" placeholder=" ">
              <label class="text-field__label" for="password">Passwort</label>
              <button class="icon-btn text-field__trailing" type="button"
                      aria-label="Passwort anzeigen" aria-pressed="false" aria-controls="password" data-toggle-password>
                <span class="material-symbols-outlined icon" aria-hidden="true">visibility</span>
              </button>
            </div>

            <div class="login-form__aside">
              <button class="btn btn--text" type="button">Passwort vergessen?</button>
            </div>

            <button class="btn btn--filled btn--block" type="submit">Anmelden</button>
          </form>

          <div class="divider-text">oder</div>

          <div class="oauth">
            <a class="btn btn--outlined btn--block oauth__btn" href="mobile-home.html">
              <img class="oauth__icon" src="assets/google-g.svg" alt="" width="20" height="20">
              <span>Mit Google fortfahren</span>
            </a>
            <a class="btn btn--outlined btn--block oauth__btn" href="mobile-home.html">
              <img class="oauth__icon" src="assets/github-mark-white.svg" alt="" width="20" height="20">
              <span>Mit GitHub fortfahren</span>
            </a>
          </div>

          <!-- Registrierungs-Screen ist noch nicht Teil des Mockups -->
          <p class="body-medium login-card__footer">
            Noch kein Konto? <a class="link" href="#registrieren">Registrieren</a>
          </p>
        </main>
      </div>
    </div>
  </div>

  <!-- Mockup-Navigation (nur zum Durchklicken, nicht Teil der App) -->
  <nav class="mockup-nav" aria-label="Mockup-Screens">
    <a href="index.html">Übersicht</a>
    <a href="desktop-home.html">Desktop · Start</a>
    <a href="desktop-login.html">Desktop · Login</a>
    <a href="mobile-home.html">Mobile · Start</a>
    <a href="mobile-login.html" aria-current="page">Mobile · Login</a>
    <a href="icons.html">Icons</a>
  </nav>

</body>
</html>
