<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGrid – Startseite (Desktop)</title>

  <!-- Schrift + Icons (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">

  <link rel="stylesheet" href="styles.css?v=31ad82c9">
  <!-- Live und Historische Daten sind vorerst leer: config.js, api.js,
       live.js und history.js werden hier noch nicht eingebunden -->
  <script src="app.js?v=7fc3de1a" defer></script>
</head>
<body>

  <!-- =================================================================
       App-Bar → AppBar(
         title: Row([Logo, Text('OpenGrid')]),
         bottom/center: TabBar(tabs: [Home, Live, Historische Daten]),
         actions: [MenuAnchor(child: CircleAvatar)])
       ================================================================= -->
  <header class="top-app-bar top-app-bar--desktop">

    <!-- Logo: nur die Bildmarke klein, daneben Schriftzug als Text -->
    <a class="brand" href="desktop-home.html" aria-label="OpenGrid – Startseite">
      <img class="brand__mark" src="logo-mark.svg" alt="" height="28">
      <span class="brand__name" aria-hidden="true">Open<span class="brand__accent">Grid</span></span>
    </a>

    <div class="top-app-bar__center">
      <!-- Reiter (breite Fenster). Der aktive Reiter steht im URL-Hash. -->
      <nav class="tabs" aria-label="Bereiche">
        <button class="tab" type="button" data-tab="home" data-tab-label="Home" aria-controls="panel-home"><span class="tab__label">Home</span></button>
        <button class="tab" type="button" data-tab="live" data-tab-label="Live" aria-controls="panel-live"><span class="tab__label"><span class="live-dot" aria-hidden="true"></span>Live</span></button>
        <button class="tab" type="button" data-tab="history" data-tab-label="Historische Daten" aria-controls="panel-history"><span class="tab__label">Historische Daten</span></button>
      </nav>

      <!-- Reiter-Menü (schmale Fenster, statt Scrollen) -->
      <div class="tabs-overflow menu-anchor">
        <button class="btn btn--text tabs-overflow__trigger" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-controls="tab-menu" data-menu-trigger>
          <span data-tab-title>Home</span>
          <span class="material-symbols-outlined icon" aria-hidden="true">arrow_drop_down</span>
        </button>
        <ul class="menu menu--start" id="tab-menu" role="menu" aria-label="Bereiche" hidden>
          <li role="none"><button class="menu__item" type="button" role="menuitemradio" aria-checked="false" data-tab="home">Home<span class="material-symbols-outlined icon menu__check" aria-hidden="true">check</span></button></li>
          <li role="none"><button class="menu__item" type="button" role="menuitemradio" aria-checked="false" data-tab="live"><span class="live-dot" aria-hidden="true"></span>Live<span class="material-symbols-outlined icon menu__check" aria-hidden="true">check</span></button></li>
          <li role="none"><button class="menu__item" type="button" role="menuitemradio" aria-checked="false" data-tab="history">Historische Daten<span class="material-symbols-outlined icon menu__check" aria-hidden="true">check</span></button></li>
        </ul>
      </div>
    </div>

    <!-- Profil-Avatar mit Menü -->
    <div class="top-app-bar__end menu-anchor">
      <button class="avatar-btn" type="button" aria-label="Profilmenü"
              aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu" data-menu-trigger>
        <span class="avatar"><span class="material-symbols-outlined icon" aria-hidden="true">person</span></span>
      </button>
      <ul class="menu menu--end" id="profile-menu" role="menu" aria-label="Profil" hidden>
        <li role="none">
          <button class="menu__item" type="button" role="menuitem">
            <span class="material-symbols-outlined icon" aria-hidden="true">person</span>Profil
          </button>
        </li>
        <li role="none">
          <button class="menu__item" type="button" role="menuitem">
            <span class="material-symbols-outlined icon" aria-hidden="true">settings</span>Einstellungen
          </button>
        </li>
        <li class="menu__divider" role="separator"></li>
        <li role="none">
          <a class="menu__item" role="menuitem" href="desktop-login.html">
            <span class="material-symbols-outlined icon" aria-hidden="true">logout</span>Abmelden
          </a>
        </li>
      </ul>
    </div>
  </header>


  <!-- =================================================================
       Body → Row([AdSlot, Expanded(Content), AdSlot])
       Unter 900px: nur Content (Werbeflächen ausgeblendet)
       ================================================================= -->
  <div class="layout">

    <!-- Werbefläche links (160 × 600) -->
    <aside class="ad-slot" aria-label="Werbefläche">
      <span class="ad-slot__code">WB</span>
      <span class="label-medium">Werbefläche</span>
      <span class="body-small">160 × 600</span>
    </aside>

    <!-- Inhaltsbereich → TabBarView([HomeView, LiveView, HistoryView]) -->
    <main class="content">

      <!-- Reiter "Home" → Willkommens-Überschrift (Startreiter nach dem Login) -->
      <section class="panel" id="panel-home" data-tab-panel="home" aria-labelledby="home-heading">
        <div class="hero">
          <img class="hero__logo" src="logo-mark.svg" alt="">
          <h1 class="hero__title" id="home-heading">
            <span class="hero__kicker">Willkommen bei</span>
            <span class="hero__brand">Open<span class="brand__accent">Grid</span></span>
          </h1>
          <span class="hero__stripe" aria-hidden="true"></span>
        </div>
      </section>

      <!-- Reiter "Live" – Inhalt folgt -->
      <section class="panel" id="panel-live" data-tab-panel="live" aria-label="Live" hidden></section>

      <!-- Reiter "Historische Daten" – Inhalt folgt -->
      <section class="panel" id="panel-history" data-tab-panel="history" aria-label="Historische Daten" hidden></section>
    </main>

    <!-- Werbefläche rechts (160 × 600) -->
    <aside class="ad-slot" aria-label="Werbefläche">
      <span class="ad-slot__code">WB</span>
      <span class="label-medium">Werbefläche</span>
      <span class="body-small">160 × 600</span>
    </aside>
  </div>


  <!-- Mockup-Navigation (nur zum Durchklicken, nicht Teil der App) -->
  <nav class="mockup-nav" aria-label="Mockup-Screens">
    <a href="index.html">Übersicht</a>
    <a href="desktop-home.html" aria-current="page">Desktop · Start</a>
    <a href="desktop-login.html">Desktop · Login</a>
    <a href="mobile-home.html">Mobile · Start</a>
    <a href="mobile-login.html">Mobile · Login</a>
    <a href="icons.html">Icons</a>
  </nav>

</body>
</html>
