<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGrid – Startseite (Mobile)</title>

  <!-- Schrift + Icons (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">

  <link rel="stylesheet" href="styles.css?v=31ad82c9">
  <!-- Live und Historische Daten sind vorerst leer: config.js, api.js,
       live.js und history.js werden hier noch nicht eingebunden -->
  <script src="app.js?v=7fc3de1a" defer></script>
</head>
<body class="device-page">

  <!-- Geräterahmen 390 × 844 (nur Mockup) -->
  <div class="device">
    <div class="device__safe-top" aria-hidden="true"></div>

    <!-- =================================================================
         Scaffold(
           appBar: AppBar(title: Logo + 'OpenGrid', actions: [Avatar]),
           body: IndexedStack([HomeView, LiveView, HistoryView]),
           bottomNavigationBar: NavigationBar([Home, Live, Historische Daten]))
         ================================================================= -->
    <div class="screen">

      <!-- App-Bar -->
      <header class="top-app-bar">
        <a class="brand" href="mobile-home.html" aria-label="OpenGrid – Startseite">
          <img class="brand__mark" src="logo-mark.svg" alt="" height="28">
          <span class="brand__name" aria-hidden="true">Open<span class="brand__accent">Grid</span></span>
        </a>

        <div class="menu-anchor">
          <button class="avatar-btn" type="button" aria-label="Profilmenü"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu" data-menu-trigger>
            <span class="avatar"><span class="material-symbols-outlined icon" aria-hidden="true">person</span></span>
          </button>
          <ul class="menu menu--end" id="profile-menu" role="menu" aria-label="Profil" hidden>
            <li role="none">
              <button class="menu__item" type="button" role="menuitem">
                <span class="material-symbols-outlined icon" aria-hidden="true">person</span>Profil
              </button>
            </li>
            <li role="none">
              <button class="menu__item" type="button" role="menuitem">
                <span class="material-symbols-outlined icon" aria-hidden="true">settings</span>Einstellungen
              </button>
            </li>
            <li class="menu__divider" role="separator"></li>
            <li role="none">
              <a class="menu__item" role="menuitem" href="mobile-login.html">
                <span class="material-symbols-outlined icon" aria-hidden="true">logout</span>Abmelden
              </a>
            </li>
          </ul>
        </div>
      </header>

      <!-- Scrollbarer Inhalt → ListView / CustomScrollView -->
      <main class="screen__body">
        <div class="screen__content">

          <!-- Reiter "Home" → Willkommens-Überschrift (Startreiter nach dem Login) -->
          <section class="panel" id="panel-home" data-tab-panel="home" aria-labelledby="home-heading">
            <div class="hero">
              <img class="hero__logo" src="logo-mark.svg" alt="">
              <h1 class="hero__title" id="home-heading">
                <span class="hero__kicker">Willkommen bei</span>
                <span class="hero__brand">Open<span class="brand__accent">Grid</span></span>
              </h1>
              <span class="hero__stripe" aria-hidden="true"></span>
            </div>
          </section>

          <!-- Reiter "Live" – Inhalt folgt -->
          <section class="panel" id="panel-live" data-tab-panel="live" aria-label="Live" hidden></section>

          <!-- Reiter "Historische Daten" – Inhalt folgt -->
          <section class="panel" id="panel-history" data-tab-panel="history" aria-label="Historische Daten" hidden></section>
        </div>
      </main>

      <!-- Navigation Bar → NavigationBar(destinations: [Home, Live, Historische Daten]) -->
      <nav class="nav-bar" aria-label="Bereiche">
        <button class="nav-bar__item" type="button" data-tab="home" aria-controls="panel-home">
          <span class="nav-bar__indicator"><span class="material-symbols-outlined icon" aria-hidden="true">home</span></span>
          Home
        </button>
        <button class="nav-bar__item" type="button" data-tab="live" aria-controls="panel-live">
          <span class="nav-bar__indicator"><span class="material-symbols-outlined icon" aria-hidden="true">sensors</span></span>
          <span class="nav-bar__label"><span class="live-dot" aria-hidden="true"></span>Live</span>
        </button>
        <button class="nav-bar__item" type="button" data-tab="history" aria-controls="panel-history">
          <span class="nav-bar__indicator"><span class="material-symbols-outlined icon" aria-hidden="true">history</span></span>
          Historische Daten
        </button>
      </nav>
    </div>
  </div>

  <!-- Mockup-Navigation (nur zum Durchklicken, nicht Teil der App) -->
  <nav class="mockup-nav" aria-label="Mockup-Screens">
    <a href="index.html">Übersicht</a>
    <a href="desktop-home.html">Desktop · Start</a>
    <a href="desktop-login.html">Desktop · Login</a>
    <a href="mobile-home.html" aria-current="page">Mobile · Start</a>
    <a href="mobile-login.html">Mobile · Login</a>
    <a href="icons.html">Icons</a>
  </nav>

</body>
</html>
